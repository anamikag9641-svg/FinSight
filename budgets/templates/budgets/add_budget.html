<!DOCTYPE html>
<html>

<head>

    <title>Add Budget - FinSight</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            background: #fb923c;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #fb923c;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>FinSight</h1>

    <p>Add a New Budget</p>

    <br>

    <div class="card">

        <form method="POST">

            {% csrf_token %}


            <label>Category</label>

            <select name="category">

                <option value="">
                    Overall Budget
                </option>

                {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>


            <label>Budget Amount</label>

            <input
                type="number"
                name="amount"
                step="0.01"
                min="0"
                placeholder="Enter budget amount"
                required
            >


            <label>Month</label>

            <select name="month" required>

                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>

            </select>


            <label>Year</label>

            <input
                type="number"
                name="year"
                value="2026"
                min="2020"
                required
            >


            <button type="submit">
                Add Budget
            </button>

        </form>

        <br><br>

        <a href="{% url 'budgets' %}">
            ← Back to Budgets
        </a>

        &nbsp;&nbsp;

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

    </div>

</div>

</body>

</html>
