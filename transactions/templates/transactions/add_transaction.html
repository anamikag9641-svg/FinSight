<!DOCTYPE html>
<html>

<head>

    <title>Add Transaction - FinSight</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        /* NAVBAR */

        .navbar {
            background: #1e293b;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fb923c;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #fb923c;
        }

        /* MAIN */

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .heading p {
            margin: 0;
            color: #94a3b8;
        }

        /* FORM CARD */

        .form-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* FORM GROUP */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            background: #0f172a;

            border: 1px solid #475569;

            border-radius: 8px;

            color: #f8fafc;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #fb923c;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* BUTTON */

        .submit-button {
            width: 100%;

            padding: 13px;

            background: #fb923c;

            border: none;

            border-radius: 8px;

            color: #0f172a;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        /* LINKS */

        .links {
            margin-top: 25px;

            display: flex;
            justify-content: space-between;
        }

        .links a {
            color: #fb923c;

            text-decoration: none;

            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                padding: 18px 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .container {
                margin-top: 30px;
            }

            .form-card {
                padding: 25px;
            }

            .links {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        FinSight
    </div>

    <div class="nav-links">

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'transactions' %}">
            Transactions
        </a>

        <a href="{% url 'budgets' %}">
            Budgets
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="container">


    <!-- HEADING -->

    <div class="heading">

        <h1>
            Add Transaction
        </h1>

        <p>
            Record your income or expenses to keep your finances updated.
        </p>

    </div>


    <!-- FORM -->

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}


            <!-- TRANSACTION TYPE -->

            <div class="form-group">

                <label for="transaction_type">
                    Transaction Type
                </label>

                <select
                    name="transaction_type"
                    id="transaction_type"
                    required
                >

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    name="amount"
                    id="amount"
                    step="0.01"
                    min="0"
                    placeholder="Enter amount"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    name="category"
                    id="category"
                    required
                >

                    {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    name="description"
                    id="description"
                    placeholder="e.g. Lunch, Bus fare, Salary..."
                ></textarea>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    name="date"
                    id="date"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button"
            >
                + Add Transaction
            </button>


        </form>


        <!-- LINKS -->

        <div class="links">

            <a href="{% url 'transactions' %}">
                ← Back to Transactions
            </a>

            <a href="{% url 'dashboard' %}">
                Back to Dashboard
            </a>

        </div>


    </div>


</div>


</body>

</html>
