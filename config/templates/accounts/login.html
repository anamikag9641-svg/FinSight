<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FinSight</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #f8fafc;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            color: #fb923c;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 35px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .message {
            background: #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            color: #e2e8f0;
            font-size: 14px;
        }

        .error {
            color: #fca5a5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;

            background: #0f172a;
            color: #f8fafc;

            border: 1px solid #475569;
            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #fb923c;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #fb923c;
            color: #0f172a;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .register {
            text-align: center;
            margin-top: 22px;

            color: #94a3b8;
            font-size: 14px;
        }

        .register a {
            color: #fb923c;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        FinSight
    </div>


    <div class="card">

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to access your financial dashboard.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message {% if message.tags == 'error' %}error{% endif %}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>


    </div>


</div>


</body>

</html>
